<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مين الدخيل؟</title>
<style>
:root{--bg:#f3f0ff;--c:#fff;--t:#1a1640;--m:#6b6a8f;--a:#ff9f1c;--b:#6c4cf5;--r:#e5384f;--g:#12a594;--ln:#e2ddf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1226;--c:#1b1f3d;--t:#f4f1ff;--m:#9aa0c9;--ln:#2d3263}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
.logo{text-align:center;font-size:34px;font-weight:800;margin:8px 0 2px;background:linear-gradient(90deg,var(--b),var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:var(--m);margin:0 0 14px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:20px;padding:16px;margin:12px 0;animation:pop .3s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
h2{margin:0 0 10px;font-size:20px}.m{color:var(--m)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 16px;background:var(--ln);color:var(--t);cursor:pointer;width:100%;margin:5px 0}
button.p{background:var(--b);color:#fff}button.s{background:var(--a);color:#2b1a00}button:disabled{opacity:.4}
input{font:inherit;width:100%;padding:13px;border-radius:14px;border:2px solid var(--ln);background:var(--bg);color:var(--t)}
.row{display:flex;gap:8px}.row button{width:auto;margin:0;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{padding:6px 12px;border-radius:99px;color:#1a1640;font-weight:700;animation:pop .3s}
.code{font-size:30px;letter-spacing:6px;background:var(--bg);padding:2px 14px;border-radius:12px;direction:ltr;display:inline-block}
.word{background:linear-gradient(135deg,var(--b),#a05cff);color:#fff;border-radius:16px;padding:18px;text-align:center;font-size:26px;font-weight:800;cursor:pointer;user-select:none}
.bub{display:flex;gap:8px;align-items:center;margin:6px 0}.bub i{font-style:normal;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#1a1640}.bub span{background:var(--bg);padding:6px 14px;border-radius:14px;font-weight:700}
.turn{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin:10px 0}.tm{color:var(--r);font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:10px;border-radius:9px;background:var(--b);transition:width .6s}
.big{font-size:24px;font-weight:800;text-align:center;margin:6px 0}.win{color:var(--g)}.lose{color:var(--r)}
.sc{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
details{margin-top:8px;color:var(--m)}summary{cursor:pointer;text-align:center}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ws=null,S=null,err='',ID='',inRoom=false,lastJoin=null;
try{ID=localStorage.getItem('imp_id')||''}catch(e){}
if(!ID){ID=Math.random().toString(36).slice(2)+Date.now().toString(36);try{localStorage.setItem('imp_id',ID)}catch(e){}}
const pBy=id=>S.pl.find(p=>p.id==id)||{n:'؟',c:'#ccc'};
const chip=p=>`<span class="chip" style="background:${p.c}">${esc(p.n)}${S&&S.host==p.id?' 👑':''}</span>`;
const hd=()=>`<div class="logo">🕵️ مين الدخيل؟</div><p class="sub">غرفة <b>${S.code}</b></p>`;
const act=(a,d={})=>ws&&ws.readyState==1&&ws.send(JSON.stringify({t:'act',a,...d}));
function connect(first){
  const proto=location.protocol=='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host);
  ws.onopen=()=>{if(first)ws.send(JSON.stringify(first));else if(lastJoin)ws.send(JSON.stringify(lastJoin))};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t=='st'){S=m.S;inRoom=true;err='';lastJoin={t:'join',code:S.code,id:ID,n:lastJoin&&lastJoin.n||''};render()}
    else if(m.t=='err'){err=m.m;inRoom=false;S=null;lastJoin=null;render()}};
  ws.onclose=()=>{if(lastJoin)setTimeout(()=>connect(),1500)};
}
function clist(){return [1,2,3].filter(r=>S.cl.some(c=>c.r==r)).map(r=>`<div class="m">الجولة ${r}</div>`+S.cl.filter(c=>c.r==r).map(c=>`<div class="bub"><i style="background:${pBy(c.id).c}">${esc(pBy(c.id).n)}</i><span>${esc(c.x)}</span></div>`).join('')).join('')}
const V={
lobby(){
  const hv=S.host==S.me;
  app.innerHTML=hd()+`<div class="card"><h2>اللاعبون (${S.pl.length}/10)</h2><div class="chips">${S.pl.map(chip).join('')}</div><p class="m">أعطِ أصحابك رمز الغرفة <span class="code">${S.code}</span></p><p class="m">يبدأ اللعب من 3 لاعبين.</p>`+(hv?`<button class="p" id="go" ${S.pl.length<3?'disabled':''}>ابدأ اللعب 🎮</button>`:`<p class="m">بانتظار المضيف…</p>`)+`</div>`;
  if(hv)$('#go').onclick=()=>act('start');
},
clues(){
  const cur=S.ord[S.t],p=pBy(cur),mine=S.me==cur;
  app.innerHTML=hd()+`<div class="card"><div class="word" id="wd">👁 اضغط لإظهار كلمتك</div><div class="turn"><span>الدور على: ${chip(p)}</span><span class="tm" id="tm"></span></div>${clist()}`+
  (mine?`<div class="row"><input id="cx" maxlength="16" placeholder="تلميحة بكلمة وحدة"><button class="p" id="sd">أرسل</button></div><p class="lose" id="er"></p>`:`<p class="m">انتظر تلميحة ${esc(p.n)}…</p>`)+`</div><details><summary>الجولة ${S.rd} من 3</summary></details>`;
  let sh=false;$('#wd').onclick=()=>{sh=!sh;$('#wd').textContent=sh?S.w:'👁 اضغط لإظهار كلمتك'};
  if(mine){const go=()=>{const x=$('#cx').value.trim();if(!x)return;if(x==S.w){$('#er').textContent='ما يصير تكتب الكلمة نفسها 😅';return}act('clue',{x})};$('#sd').onclick=go;$('#cx').onkeydown=e=>{if(e.key=='Enter')go()};$('#cx').focus()}
},
mid(){
  const hv=S.host==S.me;
  app.innerHTML=hd()+`<div class="card"><h2>خلصت الجولة ${S.rd}</h2>${clist()}<p class="m">ناقشوا بصوتكم: مين تلميحته غريبة؟</p>`+
  (hv?(S.rd<3?`<button class="s" id="mo">جولة تلميحات ثانية ➕</button>`:'')+`<button class="p" id="tv">ابدأ التصويت 🗳️</button>`:`<p class="m">بانتظار المضيف…</p>`)+`</div>`;
  if(hv){if($('#mo'))$('#mo').onclick=()=>act('more');$('#tv').onclick=()=>act('tovote')}
},
vote(){
  const done=S.vt[S.me];
  app.innerHTML=hd()+`<div class="card"><h2>مين الدخيل؟ 🕵️</h2>${clist()}`+(done?`<p class="big">صوّتّ ✅</p><p class="m">بانتظار الباقين (${Object.keys(S.vt).length}/${S.pl.length})</p>`:`<div class="grid">${S.pl.filter(p=>p.id!=S.me).map(p=>`<button data-i="${esc(p.id)}" style="background:${p.c};color:#1a1640">${esc(p.n)}</button>`).join('')}</div>`)+`</div>`;
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>act('vote',{to:b.dataset.i}));
},
res(){
  const r=S.res,imp=pBy(S.imp),mx=Math.max(1,...Object.values(r.cnt)),hv=S.host==S.me;
  app.innerHTML=hd()+`<div class="card"><div class="big ${r.caught?'win':'lose'}">${r.caught?'🎉 انكشف الدخيل!':'😈 الدخيل نجا!'}</div><p class="big">${chip(imp)}</p><p class="m" style="text-align:center">كلمة الجميع <b>${esc(S.wa)}</b> — كلمة الدخيل <b>${esc(S.wb)}</b></p>
  ${S.pl.map(p=>`<div class="bub"><i style="background:${p.c}">${esc(p.n)}</i><div style="flex:1"><div class="bar" style="width:${(r.cnt[p.id]||0)/mx*100}%"></div></div><b>${r.cnt[p.id]||0}</b></div>`).join('')}
  </div><div class="card"><h2>النقاط 🏆</h2>${[...S.pl].sort((a,b)=>b.s-a.s).map(p=>`<div class="sc"><span>${chip(p)}</span><b>${p.s}</b></div>`).join('')}`+(hv?`<button class="p" id="ag">جولة جديدة 🔁</button>`:`<p class="m">بانتظار المضيف…</p>`)+`</div>`;
  if(hv)$('#ag').onclick=()=>act('again');
}};
function render(){if(!inRoom||!S)return home();V[S.ph]()}
function home(){
  app.innerHTML=`<div class="logo">🕵️ مين الدخيل؟</div><p class="sub">لعبة تخمين الكلمات والتلميحات</p><div class="card">
  <input id="nm" maxlength="12" placeholder="اسمك"><button class="p" id="cr" style="margin-top:10px">أنشئ غرفة جديدة</button>
  <p class="m" style="text-align:center">أو ادخل بالرمز</p><div class="row"><input id="cd" inputmode="numeric" maxlength="4" placeholder="رمز الغرفة"><button class="s" id="jn">دخول</button></div><p class="lose" id="er">${err}</p>
  <details open><summary>كيف تلعب؟</summary><p>كل لاعب يأخذ كلمة سرية، والكل نفس الكلمة إلا واحد (الدخيل) كلمته مختلفة وهو ما يدري! كل واحد يعطي تلميحة بكلمة وحدة عن كلمته بدون ما يذكرها، وفي الآخر تصوّتون مين الدخيل. انكشف؟ نقطة لكل من صوّت صح. نجا؟ الدخيل ياخذ نقطتين.</p></details></div>`;
  const go=(t)=>{const n=$('#nm').value.trim(),c=$('#cd').value.trim();if(!n){$('#er').textContent='اكتب اسمك';return}
    if(t=='join'&&!/^\d{4}$/.test(c)){$('#er').textContent='الرمز 4 أرقام';return}
    const msg={t,code:c,id:ID,n};lastJoin={t:'join',code:c,id:ID,n};if(ws)try{ws.onclose=null;ws.close()}catch(e){}connect(msg)};
  $('#cr').onclick=()=>go('create');$('#jn').onclick=()=>go('join');
}
setInterval(()=>{const t=$('#tm');if(t&&S&&S.dl)t.textContent=Math.max(0,Math.ceil((S.dl-Date.now())/1000))},300);
render();
</script></body></html>
